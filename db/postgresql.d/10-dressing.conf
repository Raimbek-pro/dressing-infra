# /etc/postgresql/<ver>/main/conf.d/10-dressing.conf
# Tuned for an e2-micro (2 shared vCPU, 1 GB RAM) that runs nothing but PostgreSQL.

# --- connections ------------------------------------------------------------------
listen_addresses = 'localhost'      # replaced by 40_postgres.sh with 'localhost,<private IP>'
port = 5432
max_connections = 40                # the API uses a small pool; each connection costs RAM

# --- security ---------------------------------------------------------------------
password_encryption = scram-sha-256
ssl = on                            # Debian generates a snakeoil cert; replace with a real one later
ssl_min_protocol_version = 'TLSv1.2'

# --- memory (≈ 1 GB machine) ----------------------------------------------------------
shared_buffers = 128MB              # ~1/8 of RAM on a tiny box
effective_cache_size = 512MB        # planner hint: what the OS page cache can hold
work_mem = 4MB                      # per sort/hash, per query node
maintenance_work_mem = 64MB

# --- durability / WAL ---------------------------------------------------------------
wal_level = replica                 # allows a streaming replica or PITR later
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# --- logging (read by auditors via journald / log files) -----------------------------
log_connections = on
log_disconnections = on
log_min_duration_statement = 500    # log queries slower than 0.5 s
log_line_prefix = '%m [%p] %u@%d from %h '
log_statement = 'ddl'               # every schema change is recorded
