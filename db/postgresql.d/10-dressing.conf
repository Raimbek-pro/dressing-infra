# /etc/postgresql/<ver>/main/conf.d/10-dressing.conf
listen_addresses = 'localhost'        # 40_postgres.sh adds the private IP
password_encryption = scram-sha-256   # modern password hashing
ssl = on                              # encrypted connections
max_connections = 40                  # small VM, 1 GB RAM
log_connections = on                  # who connected, from where
