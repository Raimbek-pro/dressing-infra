# /etc/postgresql/<ver>/main/pg_hba.conf  -- first matching line wins, everything else is rejected
# TYPE    DATABASE   USER            ADDRESS          METHOD

# OS user 'postgres' (via `sudo -u postgres psql`) as DB superuser, local socket only.
local     all        postgres                         peer

# DBA OS accounts map to their own DB role of the same name (dba1 -> dba1).
local     dressing   dba1                             peer

# The backend, from the app VM only, encrypted, password hashed with SCRAM.
hostssl   dressing   dressing_app    APP_IP/32        scram-sha-256

# Local tests on the DB VM itself.
host      dressing   dressing_app    127.0.0.1/32     scram-sha-256

# Anything else: no.
host      all        all             0.0.0.0/0        reject
host      all        all             ::/0             reject
