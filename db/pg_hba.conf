# /etc/postgresql/<ver>/main/pg_hba.conf -- first matching line wins
# TYPE    DATABASE   USER           ADDRESS       METHOD
local     all        postgres                     peer            # OS user postgres only
hostssl   dressing   dressing_app   APP_IP/32     scram-sha-256   # the app VM, encrypted
host      all        all            0.0.0.0/0     reject          # everyone else
